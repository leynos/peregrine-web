# cargo-nextest configuration.
#
# Policy: no blanket retries; an intermittent failure is a defect to diagnose.

# The first release that honours every setting below (including `global-timeout`).
# `make test` checks the installed version too, because releases before 0.9.55
# ignore this key.
nextest-version = "0.9.100"

[profile.default]
# Warn after 60 s and terminate a test that has run for five warning periods
# (300 s). This governs every test no override matches.
slow-timeout = { period = "60s", terminate-after = 5 }
# The whole run. This is a hung-run backstop, not a per-test budget: the nested
# `trybuild` build below can legitimately wait tens of minutes for a shared
# compile slot, and terminating it there converts normal queueing into failure.
global-timeout = "60m"

[test-groups.nested-cargo-builds]
# Tests that start a child cargo or rustc contend for the package-cache lock
# and for build parallelism, and a cold build looks like a hang. One at a time,
# each is bounded by its own allowance.
max-threads = 1

[[profile.default.overrides]]
# All three start a child Cargo: the first two build the toolchain contracts,
# and the last runs the published example to check its documented exit status.
# Each waits for the package-cache lock and compile admission, so a cold or busy
# host can leave them queued for longer than a plain test.
filter = '''binary(=build_toolchain_contract) | binary(=clippy_lint_contract) | binary(=resource_policy_example_executable)'''
test-group = "nested-cargo-builds"
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.default.overrides]]
# `trybuild` compiles every fixture with its own `cargo --offline` build, so this
# test queues for compile admission exactly like a workspace build. Terminating
# it at a fixed allowance turns normal shared-queue waiting into a failure, which
# is why it warns every 60 s without terminating and relies on `global-timeout`
# instead. It shares the group so its nested builds never stack with the other
# nested-cargo tests.
filter = 'binary(=ownership_contract)'
test-group = "nested-cargo-builds"
slow-timeout = { period = "60s" }
